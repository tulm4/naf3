# AAA Gateway configuration for NSSAAF
component: aaa-gateway
version: "0.1.0"

server:
  addr: ":9090"
  readTimeout: 10s
  writeTimeout: 30s
  idleTimeout: 120s

redis:
  addr: "${REDIS_ADDR:-172.0.3.10:6379}"
  password: ""
  db: 0
  poolSize: 50

aaaGateway:
  bizServiceUrl: "${BIZ_URL:-http://172.0.3.16:8080}"
  listenRadius: ":1812"
  # Diameter client-initiated config (see PLAN §2.3.5):
  # Required for DER/DEA forwarding to AAA-S. Without these, DIAMETER transport silently fails.
  diameterServerAddress: "172.0.3.14:3868"  # AAA-S address (static IP per spec §4.1)
  diameterRealm: "operator.com"                     # AAA-S realm (Origin-Realm in CER)
  diameterHost: "nssaa-gw.operator.com"            # Origin-Host for CER (AAA Gateway identity)
  # "tcp" (default) or "sctp"; env override DIAMETER_TRANSPORT (RFC 6733 §3).
  diameterTransport: "${DIAMETER_TRANSPORT:-tcp}"
  # RADIUS client-initiated config:
  # Required for Access-Request forwarding to AAA-S. Disabled if empty.
  radiusServerAddress: "172.0.3.14:1812"     # AAA-S RADIUS address (static IP per spec §4.1)
  radiusSharedSecret: "secret"                      # Shared secret with AAA-S
  redisMode: "standalone"
  vipAddress: "172.0.3.15"                          # Equals the container's static IP (spec §4.2)

logging:
  level: "info"
  format: "json"

metrics:
  enabled: true
  path: "/metrics"

# Per-UE debug subsystem (optional; off by default).
# When enabled, NSSAAF emits per-UE trace events to Redis streams so an
# operator can pull a single UE's full HTTP/DB/cache/protocol/internal
# timeline for forensics. See design spec §6.
debug:
  enabled: false
  redisAddr: "${REDIS_ADDR:-172.0.3.10:6379}"
  ttl: 24h
  maxLen: 10000

# Required by config.Validate() even though AAA Gateway doesn't use crypto.
crypto:
  keyManager: "soft"
  masterKeyHex: "0102030405060708091011121314151617181920212223242526272829303132"
