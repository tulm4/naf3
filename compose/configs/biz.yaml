# NSSAAF Biz Pod configuration for development testing
# Phase 4: NF Integration & Observability — config fixture
# Usage: go run ./cmd/biz/main.go --config=compose/configs/biz.yaml

component: biz
version: "0.1.0"

server:
  addr: ":8080"
  readTimeout: 10s
  writeTimeout: 30s
  idleTimeout: 120s

database:
  host: "${POSTGRES_HOST:-172.0.3.11}"
  port: 5432
  name: "nssaa"
  user: "nssaa"
  password: "nssaa"
  maxConns: 20
  minConns: 5
  connMaxLifetime: 30m
  sslMode: "disable"

redis:
  addr: "${REDIS_ADDR:-172.0.3.10:6379}"
  password: ""
  db: 0
  poolSize: 50

eap:
  maxRounds: 20
  roundTimeout: 30s
  sessionTtl: 5m

aaa:
  responseTimeout: 10s
  maxRetries: 3
  failureThreshold: 5
  recoveryTimeout: 30s

rateLimit:
  perGpsiPerMin: 10
  perAmfPerSec: 100
  globalPerSec: 1000

logging:
  level: "info"
  format: "json"

metrics:
  enabled: true
  path: "/metrics"

# NRF integration — REMOVED in Phase 5: HTTP Gateway is now the NSSAAF NF instance
# Biz Pod discovers NFs (UDM, AMF, etc.) via the HTTP Gateway internal discovery API.
# Spec: docs/superpowers/plans/2026-07-17-nssAAF-nrf-migration-spec.md §Phase 3/5

# HTTP Gateway URL for NF discovery (Phase 3)
httpGateway:
  discoveryUrl: "${HTTP_GW_URL:-http://172.0.3.17:8443}"

# UDM integration — REQ-04, REQ-05
udm:
  baseURL: "${UDM_URL:-http://172.0.3.13:8081}"
  timeout: 10s

# AUSF integration — REQ-08
ausf:
  baseURL: "${AUSF_URL:-http://localhost:8083}"
  timeout: 10s

biz:
  aaaGatewayUrl: "${AAA_GW_URL:-http://172.0.3.15:9090}"
  # mTLS between Biz Pod and AAA Gateway
  useMTLS: false
  tlsCert: "/certs/biz-to-aaa.crt"
  tlsKey: "/certs/biz-to-aaa.key"
  tlsCa: "/certs/aaa-ca.crt"

  # S-NSSAI routing configuration for AAA protocol selection.
  # The snssai section determines which AAA protocol (RADIUS or DIAMETER) to use
  # for each slice. Protocol selection is done by the Biz Pod based on S-NSSAI.
  # 3-level lookup: exact (sst+sd), sst-only (sst, sd=*), default (sst=*, sd=*).
  #
  # Protocol options:
  #   - RADIUS: Use RADIUS Access-Request/Accept/Reject (TS 29.561 §16)
  #   - DIAMETER: Use Diameter DER/DEA (TS 29.561 §17)
  snssai:
    # Default: use DIAMETER for all slices (AAA Gateway forwards to AAA-S)
    default:
      protocol: RADIUS
      host: "172.0.3.15"
      port: 9090
      sharedSecret: "testing123"
      timeout: "10s"
    # Example: SST-only config (uncomment to use)
    # sst:
    #   - sst: 2
    #     protocol: RADIUS
    #     host: "172.0.3.15"
    #     port: 9090
    #     timeout: "10s"
    # Example: Exact config (uncomment to use)
    # exact:
    #   - sst: 1
    #     sd: "000001"
    #     protocol: RADIUS
    #     host: "172.0.3.15"
    #     port: 9090
    #     timeout: "10s"

# Cryptographic key management (Phase 5)
# Modes: soft (default), softhsm (PKCS#11), vault (HashiCorp Vault transit)
crypto:
  keyManager: "soft"  # Change to "vault" for production
  masterKeyHex: "${MASTER_KEY_HEX}"  # Required for soft mode; 64 hex chars (32 bytes)
  kekOverlapDays: 30

  # For vault mode:
  # vault:
  #   address: "http://vault.vault.svc.cluster.local:8200"
  #   keyName: "nssaa-kek"
  #   authMethod: "kubernetes"
  #   k8sRole: "nssaa-vault"
  #
  # For softhsm mode:
  # softHSM:
  #   libraryPath: "/usr/lib/softhsm/libsofthsm2.so"
  #   tokenLabel: "nssaa-kek-token"
  #   pin: "123456"

# Environment variable overrides
# These are set by the deployment tooling (docker-compose, k8s, etc.)
env:
  MASTER_KEY_HEX: ""  # 64-char hex string; REQUIRED for soft mode (set via K8s secret or docker-compose env)

internalComm:
  mode: native
  native:
    retry:
      maxAttempts: 2
      baseDelay: 500ms
      maxDelay: 10s
    circuitBreaker:
      failureThreshold: 3
      recoveryTimeout: 15s
      successThreshold: 2
    connectionPool:
      maxIdleConnsPerHost: 50
      idleConnTimeout: 60s

# Per-UE debug tracing — off by default.
# Set enabled: true per environment to capture timelines in `nssaa:debug:stream:*`.
# Spec: docs/superpowers/specs/2026-07-12-nssAAF-per-ue-debug-tracing-design.md
debug:
  enabled: true
  redisAddr: "${REDIS_ADDR:-172.0.3.10:6379}"
  ttl: 24h
  maxLen: 10000
