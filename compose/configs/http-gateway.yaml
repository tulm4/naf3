# NSSAAF HTTP Gateway Configuration
# TLS 1.3 is enabled by default. To use Istio mTLS instead, set ISTIO_MTLS=1 env var.
# When ISTIO_MTLS=1, the HTTP Gateway runs without explicit TLS config (Istio sidecar handles it).
component: http-gateway
version: "0.1.0"

server:
  addr: ":8443"
  readTimeout: 10s
  writeTimeout: 30s
  idleTimeout: 120s

httpGateway:
  bizServiceUrl: "${BIZ_URL:-http://172.0.3.16:8080}"
  # Auth bypass for E2E tests: set auth.disabled=true or pass NAF3_AUTH_DISABLED=1.
  # NEVER enable in production.
  auth:
    disabled: false
  tls:
    cert: "/tmp/e2e-tls/server.crt"
    key: "/tmp/e2e-tls/server.key"
    ca: "/tmp/e2e-tls/server.crt"

logging:
  level: "info"
  format: "json"

metrics:
  enabled: true
  path: "/metrics"

crypto:
  keyManager: "soft"
  masterKeyHex: "0102030405060708091011121314151617181920212223242526272829303132"

env:
  ISTIO_MTLS: "0"

internalComm:
  mode: native
  native:
    retry:
      maxAttempts: 3
      baseDelay: 1s
      maxDelay: 4s
    circuitBreaker:
      failureThreshold: 5
      recoveryTimeout: 30s
      successThreshold: 3
    connectionPool:
      maxIdleConnsPerHost: 100
      idleConnTimeout: 90s

# Per-UE debug tracing — off by default.
# Set enabled: true per environment to capture timelines in `nssaa:debug:stream:*`.
# Spec: docs/superpowers/specs/2026-07-12-nssAAF-per-ue-debug-tracing-design.md
debug:
  enabled: true
  redisAddr: "${REDIS_ADDR:-172.0.3.10:6379}"
  ttl: 24h
  maxLen: 10000
