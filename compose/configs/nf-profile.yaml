# NSSAAF NF Profile for HTTP Gateway
# Loaded by HTTP Gateway at startup for NRF self-registration.
# Spec: TS 29.510 §6.1 (NFProfile); docs/superpowers/plans/2026-07-17-nssAAF-nrf-migration-spec.md

nfInstanceId: "${NF_INSTANCE_ID:-}"
nfType: NSSAAF
nfStatus: REGISTERED
fqdn: "http-gateway.nssaa.svc.cluster.local"
ipv4Addresses:
  - "${HTTP_GW_IP:-172.0.3.17}"
ports:
  - port: 8443
    protocol: "HTTP/2"
    security: "TLS"
services:
  - serviceName: nnssaaf-nssaa
    versions:
      - apiVersion: v1
        fullVersion: 1.0.0
  - serviceName: nnssaaf-aiw
    versions:
      - apiVersion: v1
        fullVersion: 1.0.0
heartBeatTimer: 30
priority: 100
capacity: 1000
load: 0
