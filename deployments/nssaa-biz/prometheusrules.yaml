# Prometheus alerting rules for NSSAAF
# REQ-19: Error rate >1%, P99 >500ms, circuit breaker open, session table full
# Spec: docs/design/19_observability.md §5
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nssaa-alerts
  labels:
    team: platform
    app: nssaa-biz
spec:
  groups:
    - name: nssaa-biz.alerts
      rules:
        # High error rate — REQ-19: error rate > 1%
        - alert: NssaaHighErrorRate
          expr: |
            sum(rate(nssAAF_requests_total{status_code=~"5.."}[5m]))
            / sum(rate(nssAAF_requests_total[5m])) > 0.01
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "NSSAAF error rate > 1%"
            description: "Error rate: {{ $value | humanizePercentage }}"

        # High latency P99 — REQ-19: P99 > 500ms
        - alert: NssaaHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(nssAAF_request_duration_seconds_bucket[5m]))
              by (le)) > 0.5
          for: 5m
          labels:
            severity: major
          annotations:
            summary: "NSSAAF P99 latency > 500ms"

        # Circuit breaker open — REQ-19
        - alert: NssaaCircuitBreakerOpen
          expr: nssAAF_circuit_breaker_state == 1
          for: 1m
          labels:
            severity: major
          annotations:
            summary: "Circuit breaker OPEN for {{ $labels.server }}"

        # Session table near capacity — REQ-19
        - alert: NssaaSessionTableFull
          expr: nssAAF_eap_sessions_active > 45000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "EAP sessions approaching limit (45k/50k)"

        # Database unavailable
        - alert: NssaaDatabaseUnreachable
          expr: nssAAF_db_query_duration_seconds_count{operation="query"}[1m] == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Database queries stopped"

        # AAA server high failure rate
        - alert: NssaaAaaServerFailures
          expr: |
            sum(rate(nssAAF_aaa_requests_total{result="failure"}[5m]))
            by (server) > 10
          for: 3m
          labels:
            severity: major
          annotations:
            summary: "High failure rate for AAA server {{ $labels.server }}"

        # DLQ depth warning
        - alert: NssaaDLQDepthHigh
          expr: nssAAF_dlq_depth > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "AMF notification DLQ depth is high ({{ $value }} items)"

        # AL-G1: DLQ item exhausted MaxAttempts — permanently lost notification (Critical)
        - alert: NssaaDLQExhausted
          expr: increase(nssAAF_dlq_processed_total{result="exhausted"}[15m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "DLQ item exhausted MaxAttempts — AMF notification permanently lost"
            description: "{{ $value }} DLQ item(s) exhausted MaxAttempts in the last 15m and were discarded"

        # AL-G2: Rate limit hit frequently — possible misconfig or abuse (Major)
        - alert: NssaaRateLimitHit
          expr: |
            sum(rate(nssAAF_ratelimit_requests_total{result="limited"}[5m]))
            by (handler) > 0.1
          for: 5m
          labels:
            severity: major
          annotations:
            summary: "Rate limit triggered frequently on {{ $labels.handler }}"
            description: "Rate limit hit > 6 req/min on {{ $labels.handler }}"

        # AL-G3: DLQ stalled — processor not making progress (Critical)
        - alert: NssaaDLQProcessingStalled
          expr: |
            nssAAF_dlq_depth > 0
            and
            increase(nssAAF_dlq_processed_total[30m]) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "DLQ stalled — no items processed in 30 minutes despite depth > 0"

        # AL-G4: Circuit breaker flapping — excessive state transitions (Warning)
        - alert: NssaaCircuitBreakerFlapping
          expr: |
            sum(rate(nssAAF_httpclient_circuit_breaker_transitions_total[15m]))
            by (destination) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Circuit breaker flapping for {{ $labels.destination }} — >10 transitions in 15m"
            description: "Frequent CB state transitions indicate instability. Check network or lower failure threshold."
